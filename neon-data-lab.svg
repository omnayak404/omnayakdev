<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Om Nayak — Data Science student</title>
  <desc id="desc">A minimalist dark banner with Om Nayak's name and a small isometric data cube.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="420" fill="#0D1117"/>
  <path d="M88 304H1352" stroke="#273244" stroke-width="1"/>
  <path d="M88 304H496" stroke="url(#accent)" stroke-width="2"/>

  <g transform="translate(88 110)" font-family="Arial, Helvetica, sans-serif">
    <text fill="#22D3EE" font-size="15" font-weight="700" letter-spacing="4">DATA SCIENCE STUDENT</text>
    <text y="82" fill="#F8FAFC" font-size="68" font-weight="700" letter-spacing="-2">OM NAYAK</text>
    <text y="126" fill="#94A3B8" font-size="23">Learning from data. Building with purpose.</text>
    <text y="174" fill="#64748B" font-size="16" letter-spacing="1">PYTHON  ·  SQL  ·  MACHINE LEARNING  ·  VISUALIZATION</text>
  </g>

  <g transform="translate(1134 104)">
    <circle cx="102" cy="108" r="115" fill="#22D3EE" fill-opacity=".05" filter="url(#soft-glow)"/>
    <path d="M102 0 204 59 102 118 0 59Z" fill="url(#cube-top)"/>
    <path d="M0 59 102 118V236L0 177Z" fill="url(#cube-left)"/>
    <path d="M102 118 204 59V177L102 236Z" fill="url(#cube-right)"/>
    <path d="M102 0V118M0 59 102 118 204 59" fill="none" stroke="#E0F2FE" stroke-opacity=".7" stroke-width="1.5"/>
    <circle cx="102" cy="59" r="7" fill="#F8FAFC"/>
    <path d="M102 59 46 91M102 59 158 91M102 59V151" stroke="#F8FAFC" stroke-opacity=".7" stroke-width="1.5"/>
  </g>
</svg>
